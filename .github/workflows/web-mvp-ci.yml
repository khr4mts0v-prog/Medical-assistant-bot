name: Web MVP CI

on:
  pull_request:
    branches: [main, feature/medical-archive-mvp, feature/web-archive-mvp]
  push:
    branches: [feature/medical-archive-mvp, feature/web-archive-mvp, feature/local-document-storage]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
