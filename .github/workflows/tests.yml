name: tests
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cryptography==44.0.0 requests fastapi python-multipart pillow pytesseract pymupdf
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
