name: tests
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q .
      - name: Check clean-clone portability prerequisites
        run: python scripts/check_portability.py
      - name: Validate deployment script syntax
        run: bash -n scripts/deploy_web_release.sh
      - name: Independent synthetic classifier holdout (diagnostic; no accuracy gate)
        run: python scripts/evaluate_classifier_holdout.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q -ra
      - name: Diagnostic classifier benchmark (non-blocking until baseline is reviewed)
        run: python scripts/evaluate_classifier_corpus.py
        continue-on-error: true
      - name: Show npm version provided by setup-node
        run: npm --version
      - run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
